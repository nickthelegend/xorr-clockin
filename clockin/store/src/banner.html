<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>xorr banner</title>
<style>
  /* 1200x600 portal banner. The store draws the app icon over the bottom-left, so that corner holds nothing. */
  @font-face { font-family: "Inter"; src: url("../../../assets/fonts/Inter-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url("../../../assets/fonts/Inter-SemiBold.ttf"); font-weight: 600; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 600px; overflow: hidden; background: #000; }
  body { position: relative; color: #fff; font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 75px 75px; background-position: -1px -1px; }
  .glow { position: absolute; right: -120px; top: -40px; width: 760px; height: 760px;
          background: radial-gradient(closest-side, rgba(18,215,125,.16), transparent 70%); }
  .wordmark { position: absolute; left: 76px; top: 150px; width: 500px; }
  .tagline { position: absolute; left: 80px; top: 300px; width: 560px; font-size: 32px; line-height: 1.3; font-weight: 500; color: #a3a3ab; letter-spacing: -.2px; }
  .chip { position: absolute; left: 80px; top: 70px; display: inline-flex; align-items: center; gap: 10px;
          font-size: 18px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #a3a3ab;
          border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 10px 18px; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: #12d77d; }
  .phone { position: absolute; right: 70px; top: 46px; width: 370px; padding: 12px 12px 0; border-radius: 48px 48px 0 0;
           background: linear-gradient(180deg, #2a2a2e, #141416 40%, #0b0b0c); box-shadow: 0 0 0 2px #3a3a3f inset; height: 600px; }
  .phone .screen { border-radius: 38px 38px 0 0; overflow: hidden; height: 600px; }
  .phone img { width: 346px; display: block; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<img class="wordmark" src="../../../assets/brand/xorr-wordmark.png" alt="XORR.">
<div class="tagline">A bot that trades tokenized stocks while you get on with your life.</div>
<div class="chip"><i></i>Built for Seeker · Devnet</div>
<div class="phone"><div class="screen"><img src="shots/home-brief.png" alt=""></div></div>
</body>
</html>
